services:
  postgres:
    image: postgres:16-alpine
    container_name: suitecrm-postgres
    environment:
      POSTGRES_USER: suitecrm
      POSTGRES_PASSWORD: suitecrm
      POSTGRES_DB: suitecrm
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suitecrm -d suitecrm']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: suitecrm-redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
